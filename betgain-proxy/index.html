nav.nav button.on{background:var(--pri);color:#fff}
nav.nav button:hover:not(.on){background:#efeff1}
.wal{margin-left:auto;display:flex;align-items:center;gap:12px;white-space:nowrap}
.wal b{background:#efeff1;color:#1d1e21;padding:7px 14px;border-radius:8px}
.wal .av{width:34px;height:34px;border-radius:50%;background:var(--pri);display:grid;place-items:center;font-weight:700}
.wrap{max-width:1320px;margin:0 auto;padding:20px 24px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
.hero{background:linear-gradient(115deg,#3b0508,#7d0a11 55%,#b4121b);color:#fff;border-radius:18px;padding:22px 26px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.hero small{opacity:.85}
.hero h1{margin:4px 0 10px;font-size:30px;letter-spacing:-.5px;line-height:1.1}
.hero .odds3{display:flex;gap:8px}
.hero .odds3 button{background:rgba(255,255,255,.16);border-radius:10px;padding:9px 18px;font-weight:700;transition:background .15s}
.hero .odds3 button:hover{background:rgba(255,255,255,.28)}
.hero .odds3 button.sel{background:#fff;color:var(--pri2)}
.hero .odds3 span{display:block;font-size:11px;font-weight:500;opacity:.8}
.score{font-size:44px;font-weight:800;text-align:center;line-height:1}

.cats{display:flex;gap:10px;overflow-x:auto;padding:16px 0 4px}

.cat.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.sec{display:flex;align-items:baseline;gap:12px;margin:26px 0 10px}
.sec h2{margin:0;font-size:22px;letter-spacing:-.3px}
.sec a{margin-left:auto;color:var(--hi);font-weight:600;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--card);border-radius:14px;border-left:5px solid var(--pri);padding:14px 16px}
.card .meta{display:flex;justify-content:space-between;color:var(--mu);font-size:12.5px;margin-bottom:10px}
.live{color:var(--hi);font-weight:700;display:flex;align-items:center;gap:6px}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pri);animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
.tm{display:flex;justify-content:space-between;font-weight:600;padding:2px 0}
.tm span:last-child{font-variant-numeric:tabular-nums}
.odds{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.odds.two{grid-template-columns:repeat(2,1fr)}
.odd{background:var(--odd);border-radius:9px;padding:7px 4px;text-align:center;font-weight:700;font-size:16px;transition:background .15s,color .15s;border:1px solid transparent}
.odd span{display:block;font-size:11px;font-weight:500;color:var(--mu)}
.odd:hover:not(:disabled){border-color:var(--pri)}
.odd.sel{background:var(--pri);color:#fff}.odd.sel span{color:#ffd0d0}
.odd:disabled{opacity:.45;cursor:not-allowed}
aside.slip{position:sticky;top:82px}
.panel{background:var(--card);border-radius:16px;overflow:hidden}
.panel header{background:var(--soft);padding:14px 16px;display:flex;justify-content:space-between;font-weight:700}
.panel header span{color:var(--hi)}
.in{padding:16px}
.empty{text-align:center;padding:26px 0;color:var(--mu)}
.empty b{display:block;color:var(--tx);font-size:18px;margin-bottom:4px}
.si{border-bottom:1px dashed var(--line);padding:10px 0;font-size:13.5px}
.si b{display:flex;justify-content:space-between}
.si small{color:var(--mu)}
.rm{color:var(--mu);font-size:18px;margin-left:6px}
.stake input{width:100%;border:1px solid var(--line);background:var(--odd);color:var(--tx);border-radius:10px;padding:11px;font:inherit;margin-top:12px}
.sum{display:flex;justify-content:space-between;margin-top:10px;font-weight:600}
.place{width:100%;margin-top:12px;background:var(--pri);color:#fff;font-weight:700;padding:13px;border-radius:10px}
.place:hover{background:var(--pri2)}
.msg{margin:10px 0 0;font-size:13px;color:var(--mu)}
.demo{padding:0 16px 14px;margin:0;font-size:12px;color:var(--mu)}
@media(max-width:980px){.wrap{grid-template-columns:1fr}aside.slip{position:static}.wal b{display:none}}
@media(max-width:640px){header.top{gap:10px;padding:0 12px}.logo span{display:none}.hero{grid-template-columns:1fr}.hero h1{font-size:24px}.wrap{padding:14px 12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
