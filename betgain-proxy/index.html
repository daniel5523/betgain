<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Betgain</title>
<style>
:root{--bg:#17181b;--side:#0f1012;--card:#222327;--tx:#f1f1f3;--mu:#a3a4ad;--line:#34353b;--pri:#b4121b;--pri2:#7d0a11;--hi:#ff5757;--odd:#2d2e33;--up:#2fd07a;--down:#ff5757;--soft:#2e1518;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14.5px/1.4 "Inter","Segoe UI",system-ui,sans-serif}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.user{display:flex;gap:10px;align-items:center;padding:4px 8px 14px}
.av{width:40px;height:40px;border-radius:50%;background:var(--pri);display:grid;place-items:center;font-weight:700}
.user small{display:block;color:var(--mu)}
.free{height:54px;border-radius:12px;background:linear-gradient(120deg,var(--pri2),var(--pri));display:flex;align-items:center;padding:0 14px;font-weight:700;margin-bottom:12px}
.menu button{display:flex;width:100%;gap:12px;align-items:center;padding:11px 10px;border-radius:10px;text-align:left;color:#d6d6dc}
.menu button:hover,.menu button.on{background:#1d1e22}
.menu i{font-style:normal;width:22px;text-align:center}
.menu hr{border:0;border-top:1px solid #1d1e22;margin:10px 0}
.badge{margin-left:auto;background:var(--pri);padding:1px 8px;border-radius:10px;font-size:12px;font-weight:700}
.col{min-width:0}
.top{background:#fff;color:#1d1e21;border-bottom:4px solid var(--pri);height:64px;display:flex;align-items:center;gap:18px;padding:0 20px;position:sticky;top:0;z-index:5}
.top .logo{height:38px;width:auto;display:block}
.logotx{font-weight:800;font-size:24px;color:var(--pri2)}
.pills{display:flex;gap:4px;background:#efeff1;padding:4px;border-radius:12px;overflow-x:auto}
.pills button{padding:8px 16px;border-radius:9px;font-weight:600;color:#3a3b40;white-space:nowrap}
.pills button.on{background:var(--pri);color:#fff}
.wal{margin-left:auto;display:flex;align-items:center;gap:14px;white-space:nowrap}
.wal small{display:block;color:#6b6c74;font-size:11px;line-height:1}
.dep{background:var(--pri);color:#fff;font-weight:700;padding:10px 20px;border-radius:10px}
.dep:hover{background:var(--pri2)}
.body{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;padding:18px 20px;align-items:start}
.tabs{display:flex;gap:4px;overflow-x:auto;align-items:center}
.tabs button{padding:8px 14px;border-radius:10px;font-weight:600;color:var(--mu);white-space:nowrap}
.tabs button.on{background:var(--card);color:var(--tx)}
.cats{display:flex;gap:14px;overflow-x:auto;padding:14px 2px 6px}
.cat{display:grid;justify-items:center;gap:6px;min-width:74px;font-size:12px;font-weight:600;text-align:center;color:var(--mu)}
.cat b{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--card);border:2px solid var(--line)}
.cat.on b{border-color:var(--hi)}.cat.on{color:var(--tx)}
.sec{display:flex;align-items:center;gap:10px;margin:20px 0 10px}
.sec h2{margin:0;font-size:20px}
.sec .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--pri);font-size:14px}
.sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.go{background:var(--pri);padding:9px 16px;border-radius:10px;font-weight:700}
.all{background:var(--card);padding:7px 14px;border-radius:16px;font-weight:600}
.ar{width:32px;height:32px;border-radius:50%;background:var(--card);font-size:18px;line-height:1}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-behavior:smooth;scrollbar-width:thin}
.card{background:var(--card);border-radius:14px;flex:0 0 330px;overflow:hidden}
.card h3{margin:0;padding:12px 14px;font-size:14px;font-weight:600;border-bottom:1px solid var(--line)}
.card h3 small{display:block;color:var(--mu);font-weight:400}
.cb{padding:12px 14px}
.pill{display:inline-flex;gap:6px;align-items:center;background:var(--odd);border-radius:14px;padding:3px 10px;font-size:12px;margin-bottom:8px}
.pill.live{color:var(--hi);font-weight:600}
.pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--hi);animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
.tm{display:flex;justify-content:space-between;font-weight:600;padding:2px 0}
.tm .sc{font-variant-numeric:tabular-nums}
.mk{color:var(--mu);font-size:12px;margin:10px 0 6px}
.odds{display:flex;gap:6px}
.odd{flex:1;display:flex;justify-content:space-between;align-items:center;background:var(--odd);border-radius:8px;padding:10px;font-weight:700;border:1px solid transparent;transition:background .2s}
.odd em{font-style:normal;font-weight:400;color:var(--mu);margin-right:8px}
.odd .v{font-variant-numeric:tabular-nums}
.odd:hover:not(:disabled){border-color:var(--hi)}
.odd.sel{background:var(--pri)}.odd.sel em{color:#ffd0d0}
.odd.up .v{color:var(--up)}.odd.down .v{color:var(--down)}
.odd.up::after{content:"▲";color:var(--up);font-size:9px;margin-left:4px}.odd.down::after{content:"▼";color:var(--down);font-size:9px;margin-left:4px}
.odd:disabled{opacity:.5;cursor:not-allowed}
.more{flex:0 0 52px;justify-content:center;color:var(--mu)}
.empty-row{color:var(--mu);padding:20px 4px}
.coupon{position:sticky;top:84px}
.panel{background:var(--card);border-radius:16px;padding:16px}
.panel header{display:flex;justify-content:space-between;font-weight:700}
.panel header span{color:var(--mu)}
.empty{text-align:center;padding:22px 0 14px;font-size:18px;font-weight:700}
.empty i{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 14px;border-radius:50%;background:var(--soft);font-style:normal;font-size:24px}
.code{display:flex;gap:8px;margin-top:6px}
.code input,.stake input{flex:1;min-width:0;border:1px solid var(--line);background:var(--odd);border-radius:10px;padding:11px}
.code button{background:var(--pri2);color:#ffd0d0;font-weight:700;padding:0 16px;border-radius:10px}
.si{border-bottom:1px dashed var(--line);padding:10px 0;font-size:13.5px}
.si b{display:flex;justify-content:space-between}.si small{color:var(--mu)}
.rm{color:var(--mu);font-size:18px;margin-left:6px}
.sum{display:flex;justify-content:space-between;margin-top:10px;font-weight:600}
.stake{margin-top:12px;display:flex}
.place{width:100%;margin-top:12px;background:var(--pri);font-weight:800;padding:13px;border-radius:10px}
.place:hover{background:var(--pri2)}
.msg{margin:10px 0 0;font-size:13px;color:var(--mu)}
.demo{margin:12px 0 0;font-size:12px;color:var(--mu);text-align:center}
@media(max-width:1180px){.body{grid-template-columns:1fr}.coupon{position:static}}
@media(max-width:860px){.app{grid-template-columns:1fr}.side{display:none}.top{padding:0 12px;gap:10px}.wal small{display:none}.card{flex-basis:290px}.body{padding:12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.62);display:grid;place-items:center;z-index:20;padding:16px}.mo[hidden]{display:none}
.md{background:var(--card);border-radius:16px;padding:22px;width:min(440px,100%);max-height:85vh;overflow:auto;position:relative}.md h3{margin:0 0 12px}
.x{position:absolute;top:8px;right:14px;font-size:26px;color:var(--mu)}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--odd);padding:8px 14px;border-radius:10px;font-weight:600}.chip.on{background:var(--pri)}
.md input{width:100%;border:1px solid var(--line);background:var(--odd);border-radius:10px;padding:11px;margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#1d1e21;padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}#toast.on{opacity:1}
.pg h2{margin:6px 0}.pg>p{color:var(--mu);margin:0}.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}
.pc{background:var(--card);border-radius:14px;padding:16px}.pc h4{margin:0 0 6px}.pc p{margin:0 0 12px;font-size:13.5px;color:var(--mu)}.pc .go.done{background:var(--odd)}
.wrap{flex-wrap:wrap;overflow:visible}.row.wrap .card{flex:1 1 300px;max-width:420px}.cat{background:none}.free{width:100%;color:#fff;text-align:left}[data-go],[data-more]{cursor:pointer}
.mkt{margin-top:14px}.mkt b{display:block;margin-bottom:6px}.bt{background:var(--card);border-radius:14px;padding:14px;margin-top:10px}.bt header{display:flex;justify-content:space-between;font-weight:700}.st{color:#f5c04a}
</style>
</head>

 var A=Array.isArray(r.odds),n=function(v){return v==null?null:+v};

function depositModal(){dpm="Pix";openModal('<h3>Depositar</h3><div class="chips">'+[20,50,100,200].map(function(v){return'<button class="chip" data-act="chip:'+v+'">R$ '+v+'</button>'}).join("")+'</div><input id="dpv" type="number" min="1" placeholder="Outro valor (R$)"><div class="chips">'+["Pix","Cartão","Boleto"].map(function(m,i){return'<button class="chip'+(i?'':' on')+'" data-act="meth:'+m+'">'+m+'</button>'}).join("")+'</div><button class="place" data-act="dodep">Confirmar depósito</button><p class="demo">Demonstração: o saldo é fictício.</p>')}
function act(el){
 var a=el.dataset.act.split(":"),n=a[0];
 if(n=="close")closeModal();
 else if(n=="deposit")depositModal();
 else if(n=="chip"){$("dpv").value=a[1]}
 else if(n=="meth"){dpm=a[1];document.querySelectorAll('[data-act^="meth"]').forEach(function(b){b.classList.toggle("on",b==el)})}
 else if(n=="dodep"){var v=parseFloat($("dpv").value)||0;if(v<1){toast("Informe um valor de pelo menos R$ 1,00.");return}
  bal+=v;sv("bg_bal",bal);if(CONFIG.onDeposit)CONFIG.onDeposit(v,dpm);renderSlip();closeModal();toast("Depósito de R$ "+fmt(v)+" ("+dpm+") confirmado.")}
 else if(n=="claim"){if(ld("bg_claim",0)){toast("Bônus já resgatado.");return}bal+=10;sv("bg_bal",bal);sv("bg_claim",1);el.textContent="Resgatado ✓";el.classList.add("done");renderSlip();toast("R$ 10,00 de bônus adicionados.")}
 else if(n=="tg"){el.classList.toggle("done");el.textContent=el.classList.contains("done")?"Participando ✓":el.dataset.t;toast(el.classList.contains("done")?"Participação registrada.":"Participação cancelada.")}
 else if(n=="support"){if(CONFIG.SUPPORT_URL)window.open(CONFIG.SUPPORT_URL,"_blank","noopener");else toast("Defina CONFIG.SUPPORT_URL com o link do seu suporte.")}
 else if(n=="soon")toast("Em breve.");
}
document.addEventListener("click",function(e){
 var t=e.target;if(t.id=="modal"){closeModal();return}
 var sp=t.closest("[data-sp]");if(sp){spt=sp.dataset.sp;buildChips();renderKind("live");markSel();return}
 var c=t.closest("[data-cat]");if(c){var i=+c.dataset.cat;cat=(i==cat)?0:i;markCat();KINDS.forEach(renderKind);markSel();return}
 var m=t.closest("[data-more]");if(m){moreModal(m.dataset.more);return}
 var ac=t.closest("[data-act]");if(ac){act(ac);return}
 var g=t.closest("[data-go]");if(g){setView(g.dataset.go);window.scrollTo(0,0)}
});

/* ===== INICIALIZAÇÃO ===== */
(function(){
 var lg=$("logo");lg.onerror=function(){var s=document.createElement("span");s.className="logotx";s.dataset.go="home";s.textContent="Betgain";lg.replaceWith(s)};lg.src=CONFIG.LOGO_URL;
 buildNav();renderSlip();refresh();connectStream();setInterval(refresh,CONFIG.STREAM_URL&&!CONFIG.DEMO?30000:CONFIG.REFRESH_MS);
})();
</script>
</body>
